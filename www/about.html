<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>johnryanuy.net - About</title>
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="site-nav" aria-label="Primary">
                <a href="index.html">Homepage</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>  
        </div>
    </header>

    <main class="container">
        <section class="card" id="about-me">
            <div class="profile-header-flex">
                <h1>About Me</h1>
                <button type="button" id="open-edit-about-btn" class="btn btn-primary">Edit About Me</button>
            </div>

            <p id="display-about-text">Loading about details...</p>

        <!-- Edit About Me Modal -->
        <div id="edit-about-modal" class="modal-overlay hidden">
            <div class="modal-content card">
                <h2>Edit About Me</h2>
                
                <div id="about-error-msg" class="error-banner hidden"></div>

                <form id="edit-about-form">
                    <div class="form-group">
                        <label for="edit-about-input">About Me Description *</label>
                        <textarea id="edit-about-input" class="form-control" rows="8" placeholder="Tell us about yourself..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancel-about-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span>&copy; johnryanuy.net</span>
        <span>John Ryan Uy</span>
        <span>BSIT - 3</span>
    </footer>

    <script src="js/index.js"></script>
</body>
