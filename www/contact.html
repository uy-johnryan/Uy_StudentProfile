<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>johnryanuy.net - Contact</title>
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="site-nav" aria-label="Primary">
                <a href="index.html">Homepage</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>  
        </div>
    </header>

    <main class="container">
        <section class="card" id="contact">
            <div class="profile-header-flex">
                <h1>Contact Information</h1>
                <button type="button" id="open-edit-contact-btn" class="btn btn-primary">Edit Contact Info</button>
            </div>

            <p>Feel free to reach out to me through any of the following platforms:</p>

            <ul class="contact-list" style="margin-top: 16px; list-style: none;">
                <li style="margin-bottom: 10px;">
                    <strong>Facebook:</strong> <a id="contact-facebook" href="#" target="_blank">Loading...</a>
                </li>
                <li style="margin-bottom: 10px;">
                    <strong>GitHub:</strong> <a id="contact-github" href="#" target="_blank">Loading...</a>
                </li>
                <li style="margin-bottom: 10px;">
                    <strong>Email:</strong> <a id="contact-email" href="#">Loading...</a>
                </li>
            </ul>
        </section>

        <!-- Edit Contact Info Modal -->
        <div id="edit-contact-modal" class="modal-overlay hidden">
            <div class="modal-content card">
                <h2>Edit Contact Info</h2>
                
                <div id="contact-error-msg" class="error-banner hidden"></div>

                <form id="edit-contact-form">
                    <div class="form-group">
                        <label for="edit-facebook">Facebook URL</label>
                        <input type="url" id="edit-facebook" class="form-control" placeholder="https://facebook.com/your-profile" />
                    </div>

                    <div class="form-group">
                        <label for="edit-github">GitHub URL</label>
                        <input type="url" id="edit-github" class="form-control" placeholder="https://github.com/your-username" />
                    </div>

                    <div class="form-group">
                        <label for="edit-email">Email Address *</label>
                        <input type="email" id="edit-email" class="form-control" placeholder="your.email@example.com" />
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancel-contact-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span>&copy; johnryanuy.net</span>
        <span>John Ryan Uy</span>
        <span>BSIT - 3</span>
    </footer>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
