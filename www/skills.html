<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>johnryanuy.net - Skills</title>
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="site-nav" aria-label="Primary">
                <a href="index.html">Homepage</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>  
        </div>
    </header>

    <main class="container skills-grid">
        <section class="card" id="skills">
            <div class="profile-header-flex">
                <h1>My Skills</h1>
                <button type="button" id="open-edit-skills-btn" class="btn btn-primary">Edit Skills</button>
            </div>

            <h3>Technical Skillset</h3>
            <ul id="display-skills-list" class="tag-list" style="margin-top: 16px;">
                <!-- Dynamically populated tags -->
            </ul>
        </section>

        <aside>
            <div class="hero-media">
                <img class="hero-banner" src="img/banner/hero-banner.jpg" alt="Laptop with code on screen" width="1120" height="560" />  
            </div>
        </aside>

        <!-- Edit Skills Modal -->
        <div id="edit-skills-modal" class="modal-overlay hidden">
            <div class="modal-content card">
                <h2>Edit Skills</h2>
                
                <div id="skills-error-msg" class="error-banner hidden"></div>

                <form id="edit-skills-form">
                    <div class="form-group">
                        <label for="edit-skills-input">Skills (Separated by commas) *</label>
                        <textarea id="edit-skills-input" class="form-control" rows="4" placeholder="e.g. HTML, CSS, JavaScript, Python, Debugging"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancel-skills-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span>&copy; johnryanuy.net</span>
        <span>John Ryan Uy</span>
        <span>BSIT - 3</span>
    </footer>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
