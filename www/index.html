<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>johnryanuy.net - Homepage</title>
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="site-nav" aria-label="Primary">
                <a href="index.html">Homepage</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>  
        </div>
    </header>       

    <main class="container">
        <section class="card profile-card">
            
            <div class="profile-body">
                <button type="button" id="open-edit-btn" class="btn btn-primary">Edit Basic Info</button>
                <img 
                    id="profile-picture"
                    class="profile-image" 
                    src="img/profile1.jpg" 
                    alt="Profile picture" 
                    width="320" 
                    height="320"
                >

                <button type="button" id="change-picture-btn" class="btn btn-primary">
                    Change Profile Picture
                </button>

                <div id="camera-error" class="error-banner hidden"></div>
            </div>  
            
            
            <div class="profile-header-flex">
                <div>
                    <h1 id="display-name">John Ryan Uy</h1>
                    <p id="display-course-year" class="subtitle">BS Information Technology - 3rd Year</p>
                </div>
            </div>

            <h2 class="quote">"Pursue wisdom like a hunter, and lie in wait on her paths."</h2>
        </section>

        <!-- Edit Basic Info Modal -->
        <div id="edit-modal" class="modal-overlay hidden">
            <div class="modal-content card">
                <h2>Edit Basic Info</h2>
                
                <div id="error-msg" class="error-banner hidden"></div>

                <form id="edit-profile-form">
                    <div class="form-group">
                        <label for="edit-name">Full Name *</label>
                        <input type="text" id="edit-name" class="form-control" placeholder="Enter Full Name" />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-course">Course *</label>
                            <input type="text" id="edit-course" class="form-control" placeholder="e.g. BS Information Technology" />
                        </div>
                        <div class="form-group">
                            <label for="edit-year">Year Level *</label>
                            <input type="text" id="edit-year" class="form-control" placeholder="e.g. 3rd Year" />
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" id="save-btn" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span>&copy; johnryanuy.net</span>
        <span>John Ryan Uy</span>
        <span>BSIT - 3</span>
    </footer>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
